name: "Release"

on:
  push:
    tags:
      - 'v*' # Trigger workflow when you push a tag like 'v1.0.0'
  workflow_dispatch: # Allow triggering manually from GitHub Actions tab

jobs:
  publish-tauri:
    permissions:
      contents: write # Required for creating a release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Automatically uses the version from src-tauri/tauri.conf.json
          tagName: app-v__VERSION__ 
          releaseName: 'FM Watcher v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true # Creates a draft release so you can review before publishing
          prerelease: false
